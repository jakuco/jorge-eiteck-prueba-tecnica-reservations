services:
  postgres:
    image: postgres:16-alpine
    container_name: eiteck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eiteck
      POSTGRES_PASSWORD: eiteck_dev_password
      POSTGRES_DB: eiteck_reservations
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eiteck -d eiteck_reservations"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: eiteck-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://eiteck:eiteck_dev_password@postgres:5432/eiteck_reservations
      # Toma JWT_SECRET del .env (Compose interpola desde el .env del proyecto);
      # si no está definido, usa un valor de desarrollo.
      JWT_SECRET: ${JWT_SECRET:-dev_secret_only_for_local_docker_replace_in_env_file_aaa}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro

volumes:
  postgres_data:
    name: eiteck_postgres_data